#!/bin/bash
# --- Start MAAS 1.0 script metadata ---
# name: 99-enable-password-auth
# title: Enable password SSH in commissioning environment
# description: Temporarily enable password-based SSH login in the ephemeral commissioning/Ready environment
# script_type: commissioning
# tags: noauto
# --- End MAAS 1.0 script metadata ---

set -euxo pipefail

USER_NAME="ubuntu"
USER_PASSWORD='ENTERYYOURPASSWORD'

# Set password for the default commissioning user
echo "${USER_NAME}:${USER_PASSWORD}" | chpasswd

# Make sure SSHD includes password auth settings, regardless of distro defaults
mkdir -p /etc/ssh/sshd_config.d

cat >/etc/ssh/sshd_config.d/99-maas-password-auth.conf <<'EOF'
PasswordAuthentication yes
KbdInteractiveAuthentication yes
ChallengeResponseAuthentication yes
UsePAM yes
PermitRootLogin no
EOF

# Restart SSH service
systemctl restart ssh || systemctl restart sshd

echo "Password authentication enabled for ${USER_NAME} in commissioning environment"
