apiVersion: v1
kind: Pod
metadata:
  name: test-server
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        { "name": "sriov-net-rail-0" },
        { "name": "sriov-net-rail-1" }
      ]
spec:
  # Removed specific nodeName to allow Kubernetes to schedule anywhere
  nodeSelector:
    node-role.kubernetes.io/worker: ""
    feature.node.kubernetes.io/pci-15b3.present: "true" 
  containers:
  - name: rdma-container
    image: nvidia/cuda:12.2.0-base-ubuntu22.04
    securityContext:
      capabilities:
        add: ["IPC_LOCK", "SYS_RESOURCE", "NET_RAW"]
    resources:
      limits:
        nvidia.com/sriov_resource_a: '1'
        nvidia.com/sriov_resource_b: '1'
    command: ["sh", "-c", "apt-get update && apt-get install -y ibverbs-utils iproute2 iputils-ping perftest rdmacm-utils && sleep inf"]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-client
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        { "name": "sriov-net-rail-0" },
        { "name": "sriov-net-rail-1" }
      ]
spec:
  # Removed specific nodeName
  nodeSelector:
    node-role.kubernetes.io/worker: ""
    feature.node.kubernetes.io/pci-15b3.present: "true"
  containers:
  - name: rdma-container
    image: nvidia/cuda:12.2.0-base-ubuntu22.04
    securityContext:
      capabilities:
        add: ["IPC_LOCK", "SYS_RESOURCE", "NET_RAW"]
    resources:
      limits:
        nvidia.com/sriov_resource_a: '1'
        nvidia.com/sriov_resource_b: '1'
    command: ["sh", "-c", "apt-get update && apt-get install -y ibverbs-utils iproute2 iputils-ping perftest rdmacm-utils && sleep inf"]
