apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iscsi-autofix
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: iscsi-autofix
  template:
    metadata:
      labels:
        app: iscsi-autofix
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
      - operator: Exists
      containers:
      - name: iscsi-fixer
        image: ubuntu:24.04
        securityContext:
          privileged: true
        command:
        - /bin/bash
        - -c
        - |
          set -e
          ISCSI_FILE="/etc/iscsi/initiatorname.iscsi"
          if [ ! -f "$ISCSI_FILE" ]; then
            echo "InitiatorName=iqn.$(date +%Y-%m).$(hostname -d):$(hostname -s).$(uuidgen)" > "$ISCSI_FILE"
          fi
          nsenter -t 1 -m -u -n -i -- systemctl enable iscsid || true
          nsenter -t 1 -m -u -n -i -- systemctl restart iscsid || true
          sleep infinity
        volumeMounts:
        - name: host-etc-iscsi
          mountPath: /etc/iscsi
      volumes:
      - name: host-etc-iscsi
        hostPath:
          path: /etc/iscsi
          type: DirectoryOrCreate
